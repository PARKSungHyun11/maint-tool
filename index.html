<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Maint Tool" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Maint Tool</title>
  <style>
    :root {
      /* Login/account screen palette: black-family only, no navy. Kept as CSS vars
         (mirroring app.jsx's TEXT_BLACK/TEXT_MUTED) so a future tweak is one edit here. */
      --text-black: #1C1C1E;
      --text-muted: #6B7280;
      --border-gray: #E5E7EB;
      --bg-gray: #F2F2F7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #F2F4F7; }
    #root { height: 100dvh; overflow: hidden; }
    input, textarea, select { font-size: 16px !important; }
    input.days-input { font-size: 13px !important; }
    input.tz-search-input { font-size: 11px !important; }
    .calc-key:focus { outline: none; }
    .calc-key:focus-visible { outline: 2px solid rgb(45, 78, 138); outline-offset: 2px; }
    .app-shell > div:nth-of-type(2) > button:focus,
    .app-shell > div:nth-of-type(2) > button:focus-visible { outline:none !important; box-shadow:none !important; }
    .calc-layout,
    .calc-layout button {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }
    #root {
      /* Fluid sizing (clamp against dvh) instead of a fixed physical key height: on a short/wide
         viewport (landscape phones, unfolded foldables like the Z Fold) the keypad's 6 rows would
         otherwise overflow a fixed 1.5cm-per-row height and clip, since the Calc tab doesn't scroll.
         Scaling with viewport height keeps every row on-screen and tappable across form factors,
         while tall phones still land at the same ~1.5cm feel as before. */
      --calc-key-height: clamp(40px, 7.2dvh, 1.5cm);
      --calc-key-gap: clamp(4px, 1dvh, 8px);
      --calc-layout-gap: clamp(6px, 1.2dvh, 10px);
      --calc-ad-space: clamp(0px, 3dvh, 1.5cm);
    }
    .calc-display { flex:1 1 auto !important; min-height:0 !important; }
    .calc-keypad { flex:0 0 auto; }
    .calc-ad-space { flex:0 0 var(--calc-ad-space); }
    @keyframes tabSlideFromRight {
      from { opacity: 0; transform: translateX(28px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes tabSlideFromLeft {
      from { opacity: 0; transform: translateX(-28px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes menuSlideIn {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tab-panel { animation: none !important; }
    }
    .menu-overlay { position:fixed; top:env(safe-area-inset-top); right:0; bottom:0; left:0; z-index:500; display:flex; }
    .menu-scrim { position:absolute; inset:0; border:0; background:rgba(12,25,44,.38); }
    .flight-log-drawer { position:relative; width:min(92vw,430px); max-width:100%; height:100%; background:#FBFCFE; color:#111; display:flex; flex-direction:column; animation:menuSlideIn 180ms ease-out; box-shadow:8px 0 26px rgba(15,23,42,.15); overflow-x:hidden; touch-action:pan-y; }
    .drawer-header { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 12px; flex:0 0 auto; }
    .drawer-header>strong { font-size:24px; letter-spacing:-.02em; font-weight:850; }
    .drawer-header button { width:38px; height:38px; display:grid; place-items:center; border:1px solid #DDE3EC; border-radius:11px; background:#fff; color:#111; }
    .drawer-scroll { width:100%; max-width:100%; padding:10px 20px 18px; display:flex; flex-direction:column; gap:18px; overflow-x:hidden; overflow-y:auto; overscroll-behavior-x:none; overscroll-behavior-y:contain; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
    .new-log-button { min-height:58px; border:0; border-radius:10px; background:#1652A3; color:#fff; display:grid; place-items:center; font:850 18px/1 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; letter-spacing:.02em; }
    .new-log-button>span { display:flex; align-items:center; justify-content:center; gap:9px; transform:translateX(-4px); }
    .menu-section { display:flex; flex-direction:column; gap:9px; }
    .section-heading { display:flex; align-items:center; justify-content:space-between; min-height:28px; }
    .section-heading>strong { font-size:17px; color:#0B2856; letter-spacing:.01em; font-weight:850; }
    .section-heading button,.section-heading>span { border:0; background:transparent; color:#1652A3; font:800 14px/1 inherit; padding:5px; }
    .section-heading>span { color:#66748F; font-size:12px; }
    .draft-editor { border:1px solid #DDE3EC; border-radius:10px; background:#fff; padding:0 14px; }
    .flight-log-field { display:flex; flex-direction:column; gap:5px; padding:12px 0; border-bottom:1px solid #E8ECF2; }
    .flight-log-field:last-child { border-bottom:0; }
    .flight-log-field>span { color:#0B2856; font-size:15px; font-weight:850; letter-spacing:.025em; }
    .flight-log-field input,.flight-log-field textarea { width:100%; border:0; outline:0; resize:vertical; background:transparent; color:#66748F; font:500 15px/1.45 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; min-height:24px; padding:1px 0; }
    .flight-log-field textarea { min-height:58px; }
    .flight-log-field input::placeholder,.flight-log-field textarea::placeholder { color:#C7CDD7; opacity:1; font-size:9px !important; line-height:1.45; font-weight:500; letter-spacing:.005em; }
    .full-log-box { border:1px solid #C9D8EE; background:#EFF5FC; border-radius:0; padding:14px; display:grid; gap:12px; }
    .full-log-box p,.full-log-box textarea { color:#66748F; font:500 15px/1.5 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; white-space:pre-wrap; }
    .full-log-box textarea { width:100%; border:0; background:transparent; resize:vertical; outline:0; }
    .full-log-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .full-log-box button { border:0; min-height:38px; padding:8px 15px; display:flex; align-items:center; gap:7px; font-weight:850; font-family:inherit; }
    .full-log-box .copy-log-button { min-height:auto; border-radius:0; background:transparent; color:#1652A3; padding:3px 3px 3px 0; font-size:12px; font-weight:750; }
    .full-log-box .edit-log-button { margin-left:auto; background:transparent; color:#1652A3; padding-right:0; font-size:14px; }
    .full-log-box button:disabled { opacity:.45; }
    .recent-list { border:1px solid #DDE3EC; border-radius:10px; background:#fff; overflow:hidden; }
    .recent-row { display:flex; align-items:stretch; border-bottom:1px solid #E8ECF2; }
    .recent-row:last-child { border-bottom:0; }
    .recent-main { flex:1; min-width:0; padding:11px 8px 11px 12px; border:0; background:#fff; color:#1652A3; display:flex; align-items:center; gap:10px; text-align:left; }
    .recent-main span { min-width:0; display:flex; flex-direction:column; gap:3px; }
    .recent-main strong { color:#0B2856; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .recent-main small { color:#7D899E; font-size:12px; }
    .delete-draft { width:42px; border:0; background:#fff; color:#8A3545; display:grid; place-items:center; }
    .empty-drafts { padding:18px; text-align:center; color:#7D899E; font-size:13px; }
    .local-status { padding:4px 4px 0; color:#748199; display:flex; align-items:center; gap:6px; font-size:12px; }
    .wide-menu-row { min-height:54px; border:1px solid #DDE3EC; border-radius:10px; background:#fff; color:#1652A3; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:12px 14px; text-align:left; }
    .wide-menu-row strong { color:#0B2856; font-size:15px; }
    .drawer-notice { color:#2D4E8A; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; }
    .flight-log-drawer>footer { margin-top:auto; padding:10px 20px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--border-gray); display:flex; justify-content:space-between; color:var(--text-muted); font-size:11px; }
    .account-panel { display:flex; flex-direction:column; gap:12px; }
    .account-summary { display:flex; align-items:center; gap:10px; border:1px solid var(--border-gray); border-radius:10px; background:#fff; padding:14px; color:var(--text-black); }
    .account-summary div { display:flex; flex-direction:column; gap:3px; min-width:0; }
    .account-summary strong { color:var(--text-black); overflow:hidden; text-overflow:ellipsis; }
    .account-summary span { color:var(--text-muted); font-size:12px; }
    .entitlement-line { color:var(--text-black); font-size:13px; display:flex; align-items:center; gap:7px; padding:5px; }
    .account-actions { display:flex; flex-direction:column; gap:9px; }
    .oauth-button { min-height:48px; border:1px solid var(--border-gray); border-radius:10px; background:#fff; color:var(--text-black); font-weight:800; display:flex; align-items:center; justify-content:center; gap:9px; }
    .apple-mark { width:18px; height:18px; border-radius:50%; display:grid; place-items:center; color:var(--text-black); }
    .or-divider { display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:12px; }
    .or-divider::before,.or-divider::after { content:""; height:1px; background:var(--border-gray); flex:1; }
    .account-type-tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px; border-radius:10px; background:var(--bg-gray); }
    .account-type-tabs button { border:0; border-radius:8px; background:transparent; color:var(--text-muted); min-height:40px; font-weight:800; }
    .account-type-tabs button.active { background:#fff; color:var(--text-black); }
    .auth-label { display:flex; flex-direction:column; gap:6px; color:#0B2856; font-size:13px; font-weight:850; }
    .auth-label input,.auth-label select { width:100%; min-height:46px; padding:10px 11px; border:1px solid #D8DEE8; border-radius:9px; background:#fff; color:#44516A; outline:0; font-family:inherit; }
    .password-rules { display:grid; grid-template-columns:1fr 1fr; gap:5px 16px; padding:2px 0 3px 18px; color:var(--text-muted); font-size:11px; }
    .password-rules li.ok { color:#2D6A4F; }
    .account-notice { border-left:3px solid var(--text-black); background:var(--bg-gray); padding:10px 11px; color:var(--text-muted); font-size:12px; line-height:1.4; }

    .nef-config-card { width:100%; box-sizing:border-box; margin-bottom:20px; background:#fff; border:1.5px solid #000; border-radius:12px; box-shadow:0 2px 5px rgba(0,0,0,.16), inset 0 0 0 1px rgba(0,0,0,.04); overflow:hidden; }
    .nef-config-summary { width:100%; min-height:50px; border:0; background:#fff; padding:0 14px 0 16px; display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:12px; color:#000; font-family:inherit; text-align:left; }
    .nef-config-summary:focus,.nef-config-summary:focus-visible { outline:none !important; box-shadow:none !important; }
    .nef-config-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:22px; font-weight:800; letter-spacing:.04em; }
    .nef-config-days { font-size:12px; font-weight:600; white-space:nowrap; }
    .nef-config-editor { border-top:1px solid #E1E3E8; padding:14px; display:flex; flex-direction:column; gap:13px; }
    .nef-config-editor label { display:flex; flex-direction:column; gap:6px; color:#687184; font-size:12px; font-weight:800; letter-spacing:.06em; }
    .nef-config-editor input { width:100%; min-height:44px; border:1px solid #B9BEC8; border-radius:9px; background:#fff; padding:9px 12px; color:#111; font-family:inherit; font-weight:700; outline:none; }
    .nef-days-input { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; border:1px solid #B9BEC8; border-radius:9px; overflow:hidden; }
    .nef-days-input input { border:0; border-radius:0; }
    .nef-days-input small { align-self:stretch; padding:0 12px; border-left:1px solid #D3D6DC; display:flex; align-items:center; color:#687184; font-size:12px; font-weight:500; letter-spacing:0; }
    .nef-config-note { border-radius:8px; background:#F3F4F6; color:#687184; padding:9px 11px; font-size:12px; }
    .nef-config-actions { display:flex; justify-content:flex-end; gap:9px; }
    .nef-config-actions button { min-width:92px; min-height:40px; border:1.5px solid #000; border-radius:8px; background:#fff; color:#000; font-weight:800; }
    .nef-config-actions button.primary { background:#000; color:#fff; }

    .flight-log-tab { display:flex; flex-direction:column; gap:14px; padding-bottom:4px; color:#111; }
    .flight-log-title-card { min-height:52px; margin-bottom:7px; padding:0 12px 0 16px; border:1.5px solid #000; border-radius:12px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.14); display:flex; align-items:center; justify-content:space-between; }
    .flight-log-title-card strong { font-size:22px; letter-spacing:.04em; font-weight:850; }
    .flight-log-title-card .flight-log-history-toggle { width:34px; min-width:34px; height:34px; padding:0; border:0; border-radius:8px; background:transparent; color:#111; display:inline-flex; align-items:center; justify-content:center; box-shadow:none; }
    .flight-log-title-card .flight-log-history-toggle:focus { outline:none; }
    .flight-log-title-card .flight-log-history-toggle:focus-visible { outline:2px solid #111; outline-offset:1px; }
    .flight-log-title-card .flight-log-history-toggle[aria-expanded="true"] { background:#F1F2F4; color:#111; }
    .history-icon-stack { position:relative; width:25px; height:25px; display:inline-flex; align-items:flex-start; justify-content:flex-start; }
    .history-icon-stack>.history-clock { position:absolute; right:-1px; bottom:-1px; border-radius:50%; background:#fff; box-shadow:0 0 0 1.5px #fff; }
    .flight-log-tab .flight-log-field { gap:7px; padding:0; border:0; margin:0; }
    .flight-log-tab .flight-log-field>span { color:#111; font-size:15px; font-weight:850; letter-spacing:.055em; }
    .flight-log-tab .flight-log-field input,.flight-log-tab .flight-log-field textarea { width:100%; min-height:54px; border:1px solid #B8BEC8; border-radius:10px; background:#fff; padding:11px 12px; color:#4F5868; font:500 13px/1.4 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; font-size:13px !important; outline:0; resize:vertical; }
    .flight-log-tab .flight-log-field input:focus,.flight-log-tab .flight-log-field textarea:focus { border-color:#777E89; box-shadow:0 0 0 1px rgba(17,17,17,.05); }
    .flight-log-tab .flight-log-field textarea { min-height:78px; }
    .flight-log-tab .flight-log-field input::placeholder,.flight-log-tab .flight-log-field textarea::placeholder { color:#D2D7E0; font-size:10px !important; font-weight:450; opacity:1; }
    .flight-log-tab .flight-log-field input:focus::placeholder,.flight-log-tab .flight-log-field textarea:focus::placeholder { color:transparent; opacity:0; }
    .flight-log-fields-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
    .flight-log-divider { height:1px; background:#D3D6DC; margin:2px -3px 0; }
    .flight-log-subhead { display:flex; align-items:center; justify-content:space-between; min-height:26px; }
    .flight-log-subhead strong { font-size:17px; font-weight:850; letter-spacing:.06em; }
    .flight-log-subhead span { color:#7D8796; font-size:12px; }
    .flight-log-full { display:flex; flex-direction:column; gap:8px; }
    .flight-log-paper { position:relative; min-height:210px; padding:17px 16px 12px 19px; border:1.4px solid #222; border-radius:0 10px 10px 0; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.06); display:flex; flex-direction:column; gap:16px; }
    .flight-log-paper::before { content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:5px; background:#000; }
    .flight-log-paper p,.flight-log-paper textarea { color:#222; font:500 14px/1.55 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; white-space:pre-wrap; }
    .flight-log-paper p.empty-result { color:#9299A5; font-weight:500; }
    .flight-log-paper textarea { width:100%; min-height:120px; border:0; outline:0; resize:vertical; background:transparent; }
    .flight-log-paper textarea::placeholder { color:#9299A5; opacity:1; }
    .flight-log-paper-actions { margin-top:auto; display:flex; align-items:center; justify-content:flex-end; gap:10px; }
    .flight-log-paper-actions span { width:1px; height:24px; background:#AEB4BE; }
    .flight-log-paper-actions button { min-height:30px; border:1px solid #B8BEC8; border-radius:7px; background:#fff; color:#2D4E8A; padding:4px 8px; display:flex; align-items:center; gap:3px; font-family:inherit; font-size:12px; font-weight:800; }
    .flight-log-paper-actions button:disabled { opacity:.4; }
    .flight-log-bottom-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .flight-log-bottom-actions button { min-height:48px; border:1px solid #B8BEC8; border-radius:10px; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; font-size:15px; font-weight:850; }
    .flight-log-bottom-actions button.primary { background:#000; color:#fff; }
    .flight-log-notice { align-self:center; color:#2D4E8A; display:flex; align-items:center; gap:6px; font-size:12px; }
    .flight-log-history { padding:12px; border:1px solid #D5D9E0; border-radius:11px; background:#F8F9FB; display:flex; flex-direction:column; gap:8px; }
    .flight-log-history-list { border:1px solid #DDE1E7; border-radius:9px; background:#fff; overflow:hidden; }
    .flight-log-history-row { display:flex; border-bottom:1px solid #ECEEF2; }
    .flight-log-history-row:last-child { border-bottom:0; }
    .flight-log-history-row>button:first-child { flex:1; min-width:0; border:0; background:#fff; padding:10px; display:flex; align-items:center; gap:9px; color:#2D4E8A; text-align:left; }
    .flight-log-history-row>button span { min-width:0; display:flex; flex-direction:column; gap:2px; }
    .flight-log-history-row strong { color:#111; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .flight-log-history-row small { color:#7D8796; font-size:10px; }
    .flight-log-history-row .danger { width:40px; border:0; background:#fff; color:#8A3545; display:grid; place-items:center; }
    .keyboard-dismiss-button { position:fixed; z-index:650; right:14px; bottom:calc(12px + env(safe-area-inset-bottom)); min-height:36px; padding:0 12px; border:0; border-radius:999px; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; font:750 11px/1 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; box-shadow:0 3px 10px rgba(0,0,0,.22); }
    .fuel-input:focus::placeholder { opacity:0; }

    .panel-back { align-self:flex-start; border:0; background:transparent; color:#1C1C1E; padding:4px 2px 12px; display:flex; align-items:center; gap:10px; font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; font-size:20px; line-height:1.15; font-weight:850; }
    .login-panel .panel-back { color:#111; font-size:18px; font-weight:500; }
    .login-caption { margin:-2px 2px 8px; color:var(--text-muted); font-size:13px; line-height:1.4; }
    .provider-list { display:flex; flex-direction:column; gap:10px; }
    .provider-button-wrap { position:relative; }
    .provider-button-wrap.last-used { padding:5px; margin:-5px; border:1.8px solid #111; border-radius:13px; }
    .provider-button { width:100%; min-height:54px; border:1.2px solid var(--text-muted); border-radius:10px; background:#fff; color:#111; padding:10px 15px; display:grid; grid-template-columns:34px 1fr 34px; gap:12px; align-items:center; text-align:center; font-family:inherit; box-shadow:none; }
    .provider-button::after { content:""; width:34px; }
    .provider-button strong { font-size:15px; font-weight:500; }
    .provider-icon { width:32px; height:32px; display:grid; place-items:center; }
    .provider-icon.kakao { border-radius:8px; background:#FEE500; color:#000; }
    .last-used-badge { position:absolute; z-index:1; top:-7px; right:-8px; padding:3px 8px; border:1px solid #111; border-radius:999px; background:#fff; color:#111; font-size:9px; font-weight:750; letter-spacing:.08em; line-height:1.3; }
    .login-divider { display:flex; align-items:center; gap:12px; color:var(--text-muted); font-size:12px; margin:5px 0 1px; }
    .login-divider::before,.login-divider::after { content:""; flex:1; height:1px; background:var(--border-gray); }
    .email-auth-form { display:flex; flex-direction:column; gap:12px; }
    .email-auth-field { display:flex; flex-direction:column; gap:7px; color:#111; font-size:13px; font-weight:650; }
    .email-auth-field>input,.password-input-wrap { width:100%; min-height:48px; border:1px solid var(--border-gray); border-radius:9px; background:#fff; }
    .email-auth-field>input { padding:0 13px; color:#111; font:500 15px/1.2 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; outline:0; }
    .email-auth-field input::placeholder { color:#C4C9D1; font-size:13px; font-weight:450; }
    .email-auth-field input:focus,.password-input-wrap:focus-within { border-color:var(--text-black); box-shadow:0 0 0 2px rgba(28,28,30,.12); }
    .password-label-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .password-label-row button { border:0; background:transparent; padding:0; color:var(--text-muted); font:500 10px/1.2 inherit; }
