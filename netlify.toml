# The web build outputs to dist/ (scripts/build.mjs, and capacitor.config.json
# webDir). Publishing "." served the repository root instead: config.js is
# gitignored so it 404'd there, and ios/, android/, src/, tests/, supabase/ and
# the lockfile were all reachable. dist/ contains only the seven web assets.
[build]
  command = "pnpm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
