name: pages

# Publishes the built web app to GitHub Pages so it can be installed from a
# phone as a PWA. A home-screen PWA has no provisioning profile, so unlike a
# free-account Xcode install it never expires after seven days.
#
# This deploys dist/, not the repository root. Serving the root would 404 on
# config.js (gitignored) and expose ios/, android/, src/, tests/ and supabase/.
#
# Requires: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # config.js is gitignored, so without this the build substitutes
      # config.example.js — whose keys are empty strings. The app still runs,
      # but serviceConfig.supabaseConfigured goes false and the Supabase client
      # is never created, so sign-in and cloud sync silently do nothing.
      #
      # These are the browser-side client values that already ship inside the
      # bundle, so they are repository *variables*, not secrets. Set them at
      # Settings → Secrets and variables → Actions → Variables.
      - name: Write client config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY are unset. The calculator tabs work, but account sign-in and cloud sync will be inert in this deploy."
          fi
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const value = (name) => JSON.stringify(process.env[name] ?? "");
            writeFileSync("config.js", [
              "// Generated by .github/workflows/pages.yml — do not edit.",
              "globalThis.__MAINT_TOOL_CONFIG__ = {",
              `  supabaseUrl: ${value("SUPABASE_URL")},`,
              `  supabaseAnonKey: ${value("SUPABASE_ANON_KEY")},`,
              `  feedbackEmail: ${value("FEEDBACK_EMAIL")},`,
              "};",
              "",
            ].join("\n"));
          '

      - name: Build
        run: pnpm run build

      # Catches an asset index.html references but the build never copied.
      - name: Check the publish directory is self-contained
        run: pnpm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
